name: Actualizar resultados LEC

on:
  # Vie(5) / Sáb(6) / Dom(0) / Lun(1) a las 19:00 y 23:00 hora de España.
  # GitHub Actions usa SIEMPRE UTC en el cron, así que 19:00/23:00 en
  # horario de verano español (CEST, UTC+2, que es lo que rige durante
  # la LEC Summer, jul-sep) equivale a 17:00/21:00 UTC.
  # ⚠️ Si esto se usa fuera de horario de verano (CET, UTC+1), hay que
  # cambiar "17,21" por "18,22" para que siga siendo 19:00/23:00 en España.
  schedule:
    - cron: '0 17,21 * * 5,6,0,1'
  # Permite lanzarlo también a mano desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de actualización
        run: node scripts/update-lec.mjs

      - name: Publicar cambios si hay resultados nuevos
        run: |
          if git diff --quiet -- data.json; then
            echo "Sin cambios, nada que publicar."
          else
            git config user.name "lec-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Actualizar resultados LEC $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
